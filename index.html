<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>College Helpdesk Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="avatar">🎓</div>
      <div>
        <h1>College Helpdesk</h1>
        <p><span class="dot"></span> Rule-based chatbot · Online demo</p>
      </div>
    </header>

    <section id="chat" class="chat" aria-live="polite">
      <div class="message bot">
        <div class="bubble">Hello! Welcome to the College Helpdesk Chatbot. Ask me about admissions, fees, the library, exams, results, courses, or scholarships.</div>
      </div>
    </section>

    <div class="suggestions">
      <button type="button" data-question="How do I get admission?">Admissions</button>
      <button type="button" data-question="What about fees?">Fees</button>
      <button type="button" data-question="Tell me about the library">Library</button>
      <button type="button" data-question="When is the exam timetable?">Exams</button>
    </div>

    <form id="chat-form" class="composer">
      <label class="sr-only" for="user-input">Type your question</label>
      <input id="user-input" type="text" placeholder="Type your question..." autocomplete="off" required>
      <button type="submit" class="send">Send</button>
    </form>
    <footer>Student project · Rule-based responses using keyword matching</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
